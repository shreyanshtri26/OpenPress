# Local services: Postgres (all app data) and an S3-compatible file store.
# Start: npm run dev:infra   Data persists in Docker volumes; `docker compose down -v` wipes it.
# DynamoDB Local is only needed to copy old data: docker compose --profile dynamo up -d
services:
  dynamodb:
    profiles: ["dynamo"]
    image: amazon/dynamodb-local:3.3.1
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    user: root
    ports: ["8000:8000"]
    volumes: [dynamodb-data:/home/dynamodblocal/data]
  s3:
    # S3-compatible store (MinIO no longer publishes community images). Console: http://localhost:9001
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: openpress
      RUSTFS_SECRET_KEY: openpress-local-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["9000:9000", "9001:9001"]
    volumes: [s3-data:/data]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openpress
      POSTGRES_PASSWORD: openpress-local-secret
      POSTGRES_DB: openpress
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
volumes:
  dynamodb-data:
  s3-data:
  postgres-data:

