      rel="stylesheet" />

    <script>
      (function () {
        if (typeof window === "undefined" || typeof document === "undefined") {
          return;
        }

        try {
          var originalRemoveChild = Node.prototype.removeChild;
          var originalInsertBefore = Node.prototype.insertBefore;
          var originalAppendChild = Node.prototype.appendChild;

          Node.prototype.removeChild = function (child) {
            try {
              if (!child) {
                console.warn("Attempted to remove null/undefined child");
                return null;
              }

              if (!this.contains(child)) {
                console.warn("Child not found in parent, skipping removal");
                return child;
              }

              return originalRemoveChild.call(this, child);
            } catch (error) {
              if (
                error.name === "NotFoundError" ||
                error.name === "DOMException" ||
                (error.message && error.message.includes("not a child"))
              ) {
                console.warn("Safari DOM removeChild error prevented:", error.message);
                return child;
              }
              throw error;
            }
          };

          Node.prototype.insertBefore = function (newNode, referenceNode) {
            try {
              if (!newNode) {
                console.warn("Attempted to insert null/undefined node");
                return null;
              }

              return originalInsertBefore.call(this, newNode, referenceNode);
            } catch (error) {
              if (
                error.name === "NotFoundError" ||
                error.name === "DOMException" ||
                error.name === "HierarchyRequestError"
              ) {
                console.warn("Safari DOM insertBefore error prevented:", error.message);
                return newNode;
              }
              throw error;
            }
          };

          Node.prototype.appendChild = function (child) {
            try {
              if (!child) {
                console.warn("Attempted to append null/undefined child");
                return null;
              }

              return originalAppendChild.call(this, child);
            } catch (error) {
              if (
                error.name === "NotFoundError" ||
                error.name === "DOMException" ||
                error.name === "HierarchyRequestError"
              ) {
                console.warn("Safari DOM appendChild error prevented:", error.message);
                return child;
              }
              throw error;
            }
          };

          if (typeof window.addEventListener === "function") {
            var originalAddEventListener = window.addEventListener;
            window.addEventListener = function (type, listener, options) {
              try {
                return originalAddEventListener.call(this, type, listener, options);
              } catch (error) {
                console.warn("Safari addEventListener error prevented:", error.message);
              }
            };
          }

          if (!window.console) {
            window.console = {
              log: function () {},
              warn: function () {},
              error: function () {},
            };
          }
        } catch (initError) {
          console.error("Failed to apply Safari DOM patches:", initError);

          if (typeof Node !== "undefined" && Node.prototype) {
            try {
              var basicRemoveChild = Node.prototype.removeChild;
              Node.prototype.removeChild = function (child) {
                if (child && child.parentNode === this) {
                  return basicRemoveChild.call(this, child);
                }
                return child;
              };
            } catch (fallbackError) {
              console.error("Basic fallback also failed:", fallbackError);
            }
          }
        }
      })();
    </script>
    <script>
      (function () {
        if (!Element.prototype.remove) {
          Element.prototype.remove = function () {
            if (this.parentNode) {
              this.parentNode.removeChild(this);
            }
          };
        }

        if (!Element.prototype.closest) {
          Element.prototype.closest = function (s) {
            var el = this;
            do {
              if (el.matches(s)) return el;
              el = el.parentElement || el.parentNode;
            } while (el !== null && el.nodeType === 1);
            return null;
          };
        }

        if (!Element.prototype.matches) {
          Element.prototype.matches =
            Element.prototype.matchesSelector ||
            Element.prototype.webkitMatchesSelector ||
            Element.prototype.mozMatchesSelector ||
            Element.prototype.msMatchesSelector;
        }
      })();
    </script>
    <title>OpenPress</title>
  </head>
