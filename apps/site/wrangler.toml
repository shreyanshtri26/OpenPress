# The public newspaper: a Cloudflare Pages project (advanced mode, _worker.js) in front of the website bucket.
# BUCKET_ORIGIN is the bucket's public base URL (no trailing slash); the Deploy Site workflow fills it from SITE_BUCKET_ORIGIN.
name = "openpress-news"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"

[vars]
BUCKET_ORIGIN = ""
# Neon Auth base URL for the /_neon sign-in proxy; the Deploy Site workflow fills it from NEON_AUTH_BASE_URL.
NEON_AUTH_BASE_URL = ""
# API base URL for the reader sign-in page; the Deploy Site workflow fills it from API_URL.
API_URL = ""
