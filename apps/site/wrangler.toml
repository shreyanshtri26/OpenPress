# The public newspaper: a Cloudflare Worker in front of the website bucket.
# BUCKET_ORIGIN is the bucket's public base URL, e.g. https://<bucket-host> (no trailing slash). Set it with
#   wrangler deploy --var BUCKET_ORIGIN:https://...   (the Deploy Site workflow passes the SITE_BUCKET_ORIGIN variable).
name = "openpress-site"
main = "src/index.mjs"
compatibility_date = "2025-01-01"
workers_dev = true   # https://openpress-site.<your-subdomain>.workers.dev until you attach your own domain

# To serve your own domain later, add (the domain's DNS must be on Cloudflare):
# routes = [{ pattern = "openpress.com", custom_domain = true }, { pattern = "www.openpress.com", custom_domain = true }]  # enable once the domain is on Cloudflare
