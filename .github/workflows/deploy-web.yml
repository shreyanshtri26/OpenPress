# Builds the admin app (it contains Page Studio) and publishes it to Cloudflare Pages from `main` only.
# Needs (Environment "production"):
#   secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   vars:    API_URL, VITE_SITE_BASE_URL, VITE_CANONICAL_URL, VITE_DOMAIN, and optionally
#            CLOUDFLARE_PAGES_PROJECT (default openpress-publish), VITE_GA_MEASUREMENT_ID, VITE_YOUPI_URL,
#            VITE_YOUPI_PUBLIC_KEY, VITE_USER_DASHBOARD_API_URL, VITE_RUM_APP_MONITOR_ID, VITE_RUM_REGION
name: Deploy Web

on:
  push:
    branches: [main]
    # the admin app builds Page Studio source (/build), so a change to either redeploys it
    paths: ['apps/admin/**', 'apps/pagestudio/**', 'package-lock.json', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm test -w apps/admin
      - name: Build
        run: npm run build -w apps/admin
        env:
          VITE_BACKEND_API: ${{ vars.API_URL }}
          VITE_SITE_BASE_URL: ${{ vars.VITE_SITE_BASE_URL }}
          VITE_CANONICAL_URL: ${{ vars.VITE_CANONICAL_URL }}
          VITE_DOMAIN: ${{ vars.VITE_DOMAIN }}
          VITE_USER_DASHBOARD_API_URL: ${{ vars.VITE_USER_DASHBOARD_API_URL }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_RUM_APP_MONITOR_ID: ${{ vars.VITE_RUM_APP_MONITOR_ID }}
          VITE_RUM_REGION: ${{ vars.VITE_RUM_REGION }}
          VITE_YOUPI_URL: ${{ vars.VITE_YOUPI_URL }}
          VITE_YOUPI_PUBLIC_KEY: ${{ vars.VITE_YOUPI_PUBLIC_KEY }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/admin/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'openpress-publish' }} --branch=main
