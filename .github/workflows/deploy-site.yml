# Deploys the public newspaper (Cloudflare Pages project openpress-news) (apps/site) from `main` only. It serves the published pages from the website bucket.
# Needs (Environment "production"):
#   secrets: CLOUDFLARE_API_TOKEN (Pages edit), CLOUDFLARE_ACCOUNT_ID
#   vars:    SITE_BUCKET_ORIGIN (public base URL of the website bucket, no trailing slash)
name: Deploy Site

on:
  push:
    branches: [main]
    paths: ['apps/site/**', 'apps/api/lib/site-keys.mjs', '.github/workflows/deploy-site.yml']
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm test -w apps/site
      - name: Build Pages bundle
        working-directory: apps/site
        run: |
          mkdir -p dist && cp src/index.mjs dist/_worker.js
          sed -i 's|^BUCKET_ORIGIN = .*|BUCKET_ORIGIN = "${{ vars.SITE_BUCKET_ORIGIN }}"|' wrangler.toml
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/site
          command: pages deploy dist --project-name=openpress-news --branch=main
