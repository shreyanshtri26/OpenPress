# One-off, manual: seeds the production database and website bucket with the defaults a new newsroom needs
# (taxonomies incl. section colors, brand files for published pages). Safe to re-run. Sample stories and pages only with the demo input.
name: Seed Production

on:
  workflow_dispatch:
    inputs:
      demo:
        description: Also seed sample stories, authors and page layouts (authors get a random password nobody knows)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  seed:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
        working-directory: .
      - name: Write env file
        run: printf '%s\n' "$API_ENV_FILE" > .env.local
        env: { API_ENV_FILE: '${{ secrets.API_ENV_FILE }}' }
      - name: Use current setting names
        # Temporary: renames old keys in API_ENV_FILE; remove once the secret uses the new names.
        run: node scripts/rename-env-keys.mjs .env.local
      - run: npm run seed:taxonomies
      - run: npm run seed:site-assets
      - run: npm run publish:login
        env: { API_URL: '${{ vars.API_URL }}', NEON_AUTH_BASE_URL: '${{ vars.NEON_AUTH_BASE_URL }}' }
      - if: inputs.demo
        run: |
          export UPLOAD_ASSETS=1
          export SEED_USER_PASSWORD="$(openssl rand -hex 24)"
          npm run seed:users && npm run seed:assets && npm run seed:stories && npm run seed:pages
      - if: always()
        run: rm -f .env.local
